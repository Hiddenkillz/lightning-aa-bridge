<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="ara" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1240" height="700" fill="#020617"/>
  <rect width="1240" height="700" fill="url(#grid)"/>
  <text x="30" y="38" fill="#e2e8f0" font-size="18" font-weight="bold">Lightning AA Bridge: how the pieces talk</text>
  <text x="30" y="58" fill="#64748b" font-size="11">The Pi is a wireless Android Auto head unit to the phone, and an Android phone to Sync 4.</text>

  <!-- phone <-> pi -->
  <line x1="200" y1="300" x2="360" y2="300" stroke="#22d3ee" stroke-width="2" marker-end="url(#arc)"/>
  <line x1="360" y1="340" x2="200" y2="340" stroke="#22d3ee" stroke-width="2" marker-end="url(#arc)"/>
  <text x="280" y="280" fill="#22d3ee" font-size="9" text-anchor="middle">Wi-Fi 5 GHz</text>
  <text x="280" y="292" fill="#22d3ee" font-size="9" text-anchor="middle">AA session</text>
  <text x="280" y="358" fill="#22d3ee" font-size="9" text-anchor="middle">Bluetooth</text>
  <text x="280" y="370" fill="#22d3ee" font-size="9" text-anchor="middle">pairing + calls</text>
  <!-- pi <-> sync -->
  <line x1="960" y1="300" x2="1060" y2="300" stroke="#34d399" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="1060" y1="340" x2="960" y2="340" stroke="#34d399" stroke-width="2" marker-end="url(#arg)"/>
  <text x="1010" y="280" fill="#34d399" font-size="9" text-anchor="middle">USB-C</text>
  <text x="1010" y="292" fill="#34d399" font-size="9" text-anchor="middle">video+audio</text>
  <text x="1010" y="358" fill="#34d399" font-size="9" text-anchor="middle">USB+BT</text>
  <text x="1010" y="370" fill="#34d399" font-size="9" text-anchor="middle">touch, calls</text>
  <!-- accessories -> pi -->
  <line x1="515" y1="590" x2="515" y2="500" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ara)"/>
  <line x1="805" y1="590" x2="805" y2="500" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ara)"/>

  <!-- phone -->
  <rect x="30" y="240" width="170" height="160" rx="6" fill="#0f172a"/><rect x="30" y="240" width="170" height="160" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="115" y="300" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">Your phone</text>
  <text x="115" y="322" fill="#94a3b8" font-size="9" text-anchor="middle">wireless Android Auto</text>
  <text x="115" y="338" fill="#94a3b8" font-size="9" text-anchor="middle">thinks it is in a car</text>
  <text x="115" y="354" fill="#94a3b8" font-size="9" text-anchor="middle">never sees the camera</text>
  <text x="115" y="370" fill="#94a3b8" font-size="9" text-anchor="middle">or the OBD data</text>

  <!-- pi boundary -->
  <rect x="360" y="110" width="600" height="450" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="372" y="130" fill="#fbbf24" font-size="11" font-weight="bold">RASPBERRY PI 4  (powered by Sync's USB-C port, 5 V / 3 A)</text>

  <!-- head-unit role -->
  <rect x="380" y="150" width="270" height="90" rx="6" fill="#0f172a"/><rect x="380" y="150" width="270" height="90" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="515" y="176" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">Head-unit role</text>
  <text x="515" y="196" fill="#94a3b8" font-size="9" text-anchor="middle">Wi-Fi access point + Bluetooth</text>
  <text x="515" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">accepts the phone's AA session</text>
  <text x="515" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">decodes video, relays audio and touch</text>

  <!-- phone role -->
  <rect x="670" y="150" width="270" height="90" rx="6" fill="#0f172a"/><rect x="670" y="150" width="270" height="90" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="805" y="176" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">Phone role</text>
  <text x="805" y="196" fill="#94a3b8" font-size="9" text-anchor="middle">USB gadget that looks like a phone</text>
  <text x="805" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">always-on AA session with Sync</text>
  <text x="805" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">receives speed, gear, EV data, mic</text>

  <!-- compositor -->
  <rect x="380" y="270" width="560" height="100" rx="6" fill="#0f172a"/><rect x="380" y="270" width="560" height="100" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="660" y="296" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">Compositor + on-screen UI</text>
  <text x="660" y="316" fill="#94a3b8" font-size="9" text-anchor="middle">AA video  +  camera window / split / full  +  Energy page  +  strip, settings, preconditioning</text>
  <text x="660" y="332" fill="#94a3b8" font-size="9" text-anchor="middle">re-encoded as the "phone's" video for Sync</text>
  <text x="660" y="348" fill="#94a3b8" font-size="9" text-anchor="middle">UI touches stay here; everything else goes to the phone</text>

  <!-- call bridge -->
  <rect x="380" y="400" width="270" height="100" rx="6" fill="#0f172a"/><rect x="380" y="400" width="270" height="100" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="515" y="426" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">Call bridge</text>
  <text x="515" y="446" fill="#94a3b8" font-size="9" text-anchor="middle">two USB Bluetooth radios</text>
  <text x="515" y="460" fill="#94a3b8" font-size="9" text-anchor="middle">hands-free "car" to the phone</text>
  <text x="515" y="474" fill="#94a3b8" font-size="9" text-anchor="middle">hands-free "phone" to Sync</text>
  <text x="515" y="488" fill="#94a3b8" font-size="9" text-anchor="middle">Sync's own call screen and caller ID</text>

  <!-- obd poller -->
  <rect x="670" y="400" width="270" height="100" rx="6" fill="#0f172a"/><rect x="670" y="400" width="270" height="100" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="805" y="426" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">OBD-II poller (beta)</text>
  <text x="805" y="446" fill="#94a3b8" font-size="9" text-anchor="middle">Ford module requests over USB</text>
  <text x="805" y="460" fill="#94a3b8" font-size="9" text-anchor="middle">power, mi/kWh, pack temperatures</text>
  <text x="805" y="474" fill="#94a3b8" font-size="9" text-anchor="middle">battery health, 12 V battery</text>
  <text x="805" y="488" fill="#94a3b8" font-size="9" text-anchor="middle">preconditioning state</text>

  <!-- sync -->
  <rect x="1060" y="240" width="160" height="160" rx="6" fill="#0f172a"/><rect x="1060" y="240" width="160" height="160" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1140" y="300" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">Sync 4</text>
  <text x="1140" y="322" fill="#94a3b8" font-size="9" text-anchor="middle">F-150 Lightning</text>
  <text x="1140" y="338" fill="#94a3b8" font-size="9" text-anchor="middle">wired Android Auto</text>
  <text x="1140" y="354" fill="#94a3b8" font-size="9" text-anchor="middle">thinks a phone is plugged in</text>
  <text x="1140" y="370" fill="#94a3b8" font-size="9" text-anchor="middle">no software changes</text>

  <!-- accessories -->
  <rect x="385" y="590" width="260" height="56" rx="6" fill="#0f172a"/><rect x="385" y="590" width="260" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="515" y="614" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="bold">USB camera (UVC)</text>
  <text x="515" y="632" fill="#94a3b8" font-size="9" text-anchor="middle">rear-seat / baby cam, IR night vision</text>
  <rect x="675" y="590" width="260" height="56" rx="6" fill="#0f172a"/><rect x="675" y="590" width="260" height="56" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="805" y="614" fill="#e2e8f0" font-size="11" text-anchor="middle" font-weight="bold">OBD-II USB adapter</text>
  <text x="805" y="632" fill="#94a3b8" font-size="9" text-anchor="middle">plugged into the vehicle's OBD port</text>

  <!-- legend -->
  <text x="30" y="676" fill="#64748b" font-size="9">cyan = phone side (wireless)    green = vehicle side (USB + Bluetooth)    amber = the Pi and its accessories</text>
</svg>
