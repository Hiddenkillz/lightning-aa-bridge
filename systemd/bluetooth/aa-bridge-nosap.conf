# BlueZ's built-in SIM Access (SAP) server listens on RFCOMM channel 8, the channel aa-bridge pins the AA Wireless profile to. With it running, bluetoothd logs
# "RFCOMM server failed for AA Wireless: rfcomm_bind: Address already in use", the AA Wireless service never appears (no 4de17a00 in `bluetoothctl show`)
# and the phone pairs but never starts wireless Android Auto. The bridge has no use for SAP.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap
